# ---------------------------------------------------------------------------
# How to use: leap
# ---------------------------------------------------------------------------
#
# Leap goes to anything you can see. Press "y" (the default binding), then type
# the two characters at the destination -- the start of the word you are
# looking at, usually.
#
# One match on screen and the cursor is already there. Several, and each match
# wears a home-row label:
#
#   a label       land on that match
#   a CAPITAL     select from here to that match, like an extend motion
#   A-label       put an extra cursor on that match; the labels stay up
#   a plain label after picking extras   land there, every picked cursor along
#   *             a cursor on every match, the nearest one primary
#   enter         the nearest match -- or exactly the picks, once any exist
#   space         the next page of labels, when matches outnumber keys
#   esc           cancel; caret unmoved, picks dropped
#
# Leap is eyes-only: it finds what is on screen, nothing else.

# ---------------------------------------------------------------------------
# How to use: smart_jump
# ---------------------------------------------------------------------------
#
# smart_jump goes back to somewhere you have been -- a file, a definition, a
# line -- in one prompt, without picking a picker first. Its corpus is the
# project database: only places you have actually visited. Nothing found means
# you have not been there, and the pickers are the tool for that.
#
# Press "h" (the default binding) and type. The rules:
#
#   - terms are whitespace-separated, and every term must match
#   - terms before any keyword match the file
#   - a bare single letter is a clause keyword: c content, d definition, f file
#   - bare digits are a line number; quote them ('640') for a file called 640
#   - a match term needs two characters -- that is what keeps single letters
#     free to be keywords; a one-letter term is an error, quoted or not
#
#   key cpp            a visited file matching key and cpp
#   key cpp c split    ... then a visited line in it containing split
#   nav d pin          visited definitions matching pin, in files matching nav
#   key 640            the visited line in keymap.cpp nearest 640
#
# While typing, a box at the caret holds the query -- its sigil ᛃ, the j
# rune; icons off spells it jump: -- and the match count and where enter
# would go hang off the box. It flips above the caret when there is no room
# below, and a terminal too small for it falls back to the bottom row.
# A landing or a step leaves the same rounded box at the caret, wearing the
# same ᛃ and naming where the next press of the walk would go; the first key
# that is not a step buries it, and the bar stays out of it entirely. The
# destination in either box is painted `ui.jump.next` -- green in the
# shipped themes -- so it never reads as a file name.
#
#   enter      land on the best match
#   b          step to the next match of the last query, "B" back -- and the
#              same two keys walk a picker's rows after a pick, whichever list
#              was made last; the box at the caret names where the next press
#              would go, and says so when that press wraps around the list
#   tab        hand the terms to the picker the most specific clause names --
#              file, symbol or content. A query with no matches goes to that
#              picker on enter as well
#   esc        cancel; stepping still works for the last submitted query
#
# A wrong landing costs nothing: it is recorded only after you have stood in it
# for ~2 seconds or edited there, so a jump you step away from teaches the
# corpus nothing.
#
# The corpus fills as you work: lingering at a place for a few seconds records
# a visit, edits record edit locations, and a jump you keep teaches the query
# its target. A fresh project starts empty and the ranking sharpens with use.

# ---------------------------------------------------------------------------
# How to use: the pickers
# ---------------------------------------------------------------------------
#
# Every picker is the same prompt: a box at the caret, a band of up to five
# rows hanging off it, and -- for every picker that points into a file
# (definitions, references, symbols, content) -- a block of context lines
# around the selected target. What you type is a case-insensitive regex
# filtered over the list; a pattern that does not compile keeps the last good
# list and says why on the branch row. Symbols and content stream in while you
# type -- the count says "scanning…" while more is coming, and "truncated" if a
# huge project hit the corpus ceiling -- picker-corpus-max-bytes, above.
#
# The pickers that point into files -- definitions, references, both symbol
# lists, content -- draw at the screen's full width, because their rows are
# lines of source. A file or buffer band is a list of paths, so it is drawn
# only as wide as its widest row and hangs off the box.
#
# Every row reads the same way: what the row is for on the left -- the file's
# path, the symbol's name, the matched line -- and where it points,
# `path:line`, dimmed at the card's right edge. Long text clips at that column
# rather than pushing the path off the card, and a path drops out entirely
# where keeping it would leave the text no room. A file or buffer row is its
# own path, so it carries no second copy of it.
#
# The last row carries a dimmed `i/n/m`: which row of the filtered list is
# selected, how many rows the filter left, how many candidates there were.
#
#   1..5       take that row of the band; 0 and 6..9 still type into the
#              query, and a buffers band grown past five is walked, not
#              numbered
#   tab / down     step the selection forward, shift-tab / up back
#   enter      take the selection
#   esc        cancel -- the only way out; backspace on an empty query
#              deletes nothing rather than closing the prompt
#
# A pick leaves the filtered list behind as the walk: "b" steps forward
# through it, "B" back, the same keys that walk smart-jump matches. A step
# that cannot land -- a row whose file will not open -- says so and stays
# where it stood.
#
# last_picker reopens whatever was open last, query and all, routed by name:
# files, buffers, definition, references, buffer-symbols, symbols, content.
# Only a query that compiled is recorded, so a half-typed pattern is never
# what comes back.
