# ---------------------------------------------------------------------------
# How to use: leap
# ---------------------------------------------------------------------------
#
# Leap goes to anything you can see. Press "y" (the default binding), then type
# the two characters at the destination -- the start of the word you are
# looking at, usually.
#
# One match on screen and the cursor is already there. Several, and each match
# wears a home-row label:
#
#   a label       land on that match
#   a CAPITAL     select from here to that match, like an extend motion
#   A-label       put an extra cursor on that match; the labels stay up
#   a plain label after picking extras   land there, every picked cursor along
#   *             a cursor on every match, the nearest one primary
#   enter         the nearest match -- or exactly the picks, once any exist
#   space         the next page of labels, when matches outnumber keys
#   esc           cancel; caret unmoved, picks dropped
#
# Leap is eyes-only: it finds what is on screen, nothing else.

# ---------------------------------------------------------------------------
# How to use: smart_jump
# ---------------------------------------------------------------------------
#
# smart_jump goes back to somewhere you have been -- a file, a definition, a
# line -- in one prompt, without picking a picker first. Its corpus is the
# project database: only places you have actually visited. Nothing found means
# you have not been there, and the pickers are the tool for that.
#
# Press "h" (the default binding) and type. The rules:
#
#   - terms are whitespace-separated, and every term must match
#   - terms before any keyword match the file
#   - a bare single letter is a clause keyword: c content, d definition, f file
#   - bare digits are a line number; quote them ('640') for a file called 640
#   - a match term needs two characters -- that is what keeps single letters
#     free to be keywords; a one-letter term is an error, quoted or not
#
#   key cpp            a visited file matching key and cpp
#   key cpp c split    ... then a visited line in it containing split
#   nav d pin          visited definitions matching pin, in files matching nav
#   key 640            the visited line in keymap.cpp nearest 640
#
# While typing, the status line shows the match count and where enter would go.
#
#   enter      land on the best match
#   b          step to the next match of the last query, "B" back; the
#              status names where the next press would go, and says so when
#              that press wraps around the list
#   tab        hand the terms to the picker the most specific clause names --
#              file, symbol or content. A query with no matches goes to that
#              picker on enter as well
#   esc        cancel; stepping still works for the last submitted query
#
# One match left and the prompt quiet for a moment, and it jumps on its own --
# no enter. A wrong guess costs nothing: the landing is recorded only after you
# have stood in it for ~2 seconds or edited there, and reopening the prompt
# before then types the query that fired back in, to extend rather than retype.
# `editor.smart-jump-auto = false` turns the auto-jump off; everything else
# stays as above.
#
# The corpus fills as you work: lingering at a place for a few seconds records
# a visit, edits record edit locations, and a jump you keep teaches the query
# its target. A fresh project starts empty and the ranking sharpens with use.
