# koi -- every configuration option there is.
#
# Config files, both optional, read in this order:
#
#   1. ~/.config/ronin/koi.toml   global
#   2. .ronin/koi.toml            per project, relative to koi's working dir
#
# If both exist both are read, later wins, key by key. This file is neither of
# them -- it is a reference and is never loaded. Copy out what you want.
#
# `:config-reload` re-reads both. It resets to the built-in defaults first, so
# deleting a key restores its default. Everything applies immediately except
# scan-workers, which can be raised live but not lowered, and the two picker
# ceilings, which are read when a scan starts and when a picker opens.
#
# Values below are the defaults unless a comment says otherwise.
#
# Bad values:
#   wrong type    reported, default kept -- `tab-width = "4"` is an error
#   out of range  clamped silently -- `scrolloff = 900` becomes 100
#   unknown key   ignored
#
# Problems are counted on the status line at startup and after :config-reload.
# `:messages` lists them.

# ---------------------------------------------------------------------------
# Top level
# ---------------------------------------------------------------------------

# Theme file name without the `.toml`, found along the runtime path described
# in theme.example.toml. `:theme <name>` switches at runtime. An unknown name
# falls back to the built-in theme and warns. koi ships `ronin` and `calm`.
theme = "ronin"

# ---------------------------------------------------------------------------
# [editor]
# ---------------------------------------------------------------------------
[editor]

# Tab width 1-16, and whether indenting inserts spaces or a tab. koi detects
# the indentation of every file it opens and uses that instead, so these two
# only apply when there is nothing to detect. `:set-indent tab|<1-16>`
# overrides both for one buffer.
tab-width                        = 4
indent-spaces                    = true

auto-pairs                       = true # a typed ( " [ closes itself around the caret
scrolloff                        = 3 # Lines kept visible above and below the cursor when scrolling, 0-100.
line-number                      = "relative" # "absolute". Any other string means relative.
cursorline                       = true # highlight current line, with `ui.cursorline.primary`
excerpt-context                  = 2 # Lines of context around a hit in the excerpt views and around
                                     # the target in a picker's block, 0-100. Alt+= / alt+- adjust it
                                     # from inside a picker.
scan-workers                     = 1 # Threads for searches/references/file scans, 1-32. Raising it
                                     # applies live (and on :config-reload); lowering it takes a
                                     # restart -- the pool only ever grows while koi runs.
trim_trailing_whitespace_on_save = false # default is true. Runs on :w. Note the underscores:
                                         # this is the only key that is not kebab-case.
record                           = false # whether to record key presses, into keylog.db
                                         # beside the project database

# How the mode label is drawn: "bar" colours the text, "block" fills a block
# behind it. Both use `ui.statusline.normal` / `ui.statusline.insert`.
mode-indicator                   = "bar" # "block"

# The mode label. Only used while icons are on -- with them off it is NOR/INS.
mode-normal                      = "🐒"
mode-insert                      = "🐑"

# Pasting text koi did not copy into more than one cursor. "full" gives every
# cursor the whole text; "spread" gives each cursor one line, but only when the
# line count is exactly the cursor count -- any other number pastes whole and
# says so, rather than dropping lines or padding with blanks to fit.
# `:set-multicursor-paste spread|full` overrides it for the session. koi's own
# multi-cursor copy is unaffected either way: it always comes back one
# selection per cursor.
multi-cursor-paste               = "full" # "spread"

# Shell command the file pickers take their candidates from: one path per line
# on stdout. A trailing `|` is trimmed. Unset, koi uses
#   find . -type f -printf '%P\n' | gai -e '.*(build|.git)'
file-filter = "find . -type f -not -path '*/.git/*' -printf '%P\\n'"

# The two picker ceilings, both in bytes. Per project on purpose: they are
# statements about this tree's size against this machine's memory, not tastes.
#
# picker-corpus-max-bytes is how much of a streaming scan's output the corpus
# will hold. Content emits every non-blank line of the project and the corpus is
# the row storage, so a big enough tree is the editor's memory. Past this the
# read stops and the band keeps what landed -- that is the "truncated" the count
# says. Raise it for a huge tree on a big machine; lower it on a small one.
#
# picker-file-max-bytes is the biggest file a picker will read to draw a row's
# line or its context block. Past it the row keeps the text the scan gave it and
# the block draws nothing, the same as a row whose file went missing -- which is
# what keeps a bundled script or a checked-in dump from costing a frame. Raise
# it for a project with big files worth stepping through.
#
# Both are read once, where they are spent: the corpus ceiling when a scan
# starts, the file ceiling when a picker opens. `:config-reload` therefore
# applies to the next scan or prompt, never to a live one.
picker-corpus-max-bytes          = 268435456 # 256 MiB; clamped to 4 MiB - 64 GiB
picker-file-max-bytes            = 8388608 # 8 MiB; clamped to 1 MiB - 1 GiB

# ---------------------------------------------------------------------------
# [editor.icons]
# ---------------------------------------------------------------------------
#
# `icons = false` directly under [editor] is shorthand for `enable = false`
# here.
[editor.icons]

enable = true
error    = ""   # a failed write, a query that will not compile -- red
warning  = ""   # a refusal you can act on -- yellow
info     = ""   # an ordinary message
readonly = ""   # the file is on disk and this process cannot write it
modified = ""   # unsaved changes
file     = ""   # sits before the path

# ---------------------------------------------------------------------------
# [editor.soft-wrap]
# ---------------------------------------------------------------------------

[editor.soft-wrap]

enable = false

# Drawn at the start of every continuation row, in `ui.virtual.wrap`. Its width
# is also the continuation indent, capped at one column less than the pane.
wrap-indicator = "↳ "

# How far back a break may travel to land after a space, 0-1000. A long path or
# URL has no space to take, so it breaks mid-word rather than leaving most of a
# row blank.
max-wrap = 20

# ---------------------------------------------------------------------------
# [editor.whitespace]
# ---------------------------------------------------------------------------
[editor.whitespace]

# "all"   draw tabs, using the glyphs below
# "none"  leave them blank
#
# Default is "all". Anything that is not the string "none" draws them, so a
# value borrowed from another editor -- "trailing", "leading" -- turns them all
# on rather than failing. Only a non-string is refused. Tabs are the only
# whitespace koi draws; there is no space, nbsp or newline rendering to ask
# for.
render = "none"

# The per-kind table form is also accepted, and only `tab` is read from it:
#
#   [editor.whitespace.render]
#   tab = "all"

[editor.whitespace.characters]

# `tab` lands on the first column of the tab, `tabpad` fills the rest of the
# way to the tab stop. Both are drawn in `ui.virtual.whitespace`, foreground
# only. Setting `tab` turns rendering on unless `render` above says otherwise;
# `tabpad` alone does not.
tab    = "→"
tabpad = "·"

# ---------------------------------------------------------------------------
# [keys.*]
# ---------------------------------------------------------------------------
#
#   "u"     = "move_char_left"
#   "ret"   = ["insert_newline", "normal_mode"]
#   [keys.normal.g]
#   "t"     = "goto_file_start"
#
# Key names: a single character, or one of
#   esc ret enter tab backspace del delete ins insert space minus
#   left right up down home end pageup pagedown F1..F12
# with modifier prefixes `C-` (ctrl), `A-` or `M-` (alt), `S-` (shift), in any
# order. Shift on a character key *is* the capital, so "S-a" and "A" are the
# same key.
#
# Counts: in normal mode a run of digits starting with 1-9 is a count prefix,
# shown as `x12` on the right of the status line, and the next command consumes
# it -- `5l` moves five words, `12G` goes to line 12. A command that does not
# read a count still clears it. `0` only extends a count already started, so it
# stays bindable; `1`-`9` cannot be bound at the top level of [keys.normal].


# !!!!!!!!!!
# Two things a terminal cannot deliver, both refused with a message:
#   * C-S-<letter>  -- the same byte as C-<letter>
#   * C-<non-letter> -- there is no control byte for it
# `A-S-l` is fine: it parses to `A-L`.

[keys.normal]
"'" = "file_picker"

[keys.insert]
"A-v" = "paste_clipboard_after"

