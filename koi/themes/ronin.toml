"attribute"                 = { fg = "white"                                   }
"comment"                   = { fg = "light_gray"                              }
"constant"                  = { fg = "green"                                   }
"constant.numeric"          = { fg = "green"                                   }
"constant.builtin"          = { fg = "green"                                   }
"constant.character.escape" = { fg = "moss_green"                              }
"constructor"               = { fg = "light_yellow"                            }
"function"                  = { fg = "light_yellow"                            }
"function.builtin"          = { fg = "light_yellow"                            }
"function.macro"            = { fg = "light_yellow"                            }
"preproc_ifdef"             = { fg = "light_yellow"                            }
"keyword"                   = { fg = "white"                                   }
# Keywords are plain: indentation already shows the structure. Red is for the
# ones that leave the block -- the jumps and return -- which is also where
# rust's query files break/continue (under keyword.control.return).
"keyword.control"           = { fg = "white"                                   }
"keyword.control.import"    = { fg = "white"                                   }
"keyword.control.exception" = { fg = "white", modifiers = ["underlined"]       }
"keyword.control.jump"      = { fg = "red"                                     }
"keyword.operator"          = { fg = "white"                                   }
"keyword.control.return"    = { fg = "red", modifiers=["underlined"]           }
"keyword.directive"         = { fg = "white"                                   }
"keyword.storage.modifier"  = { fg = "white"                                   }
"label"                     = { fg = "white"                                   }
"namespace"                 = { fg = "white"                                   }
"operator"                  = { fg = "white"                                   }
"special"                   = { fg = "white"                                   }
"string"                    = { fg = "green"                                   }
"type"                      = { fg = "cyan"                                    }
"variable.builtin"          = { fg = "white"                                   }
"variable.parameter"        = { fg = "white"                                   }
"variable.other.member"     = { fg = "white"                                   }
"variable.other.enummember" = { fg = "white"                                   }
"variable"                  = { fg = "white"                                   }
"punctuation"               = { fg = "white"                                   }
"punctuation.special"       = { fg = "white"                                   }

"markup.heading"            = { fg = "gold"  , modifiers = ["bold"]            }
"markup.raw.inline"         = { fg = "green"                                   }
"markup.raw.block"          = { fg = "white"                                   }
"markup.bold"               = { fg = "gold"  , modifiers = ["bold"]            }
"markup.italic"             = { fg = "gold", modifiers = ["italic"]            }
"markup.strikethrough"      = { fg = "white" , modifiers = ["crossed_out"]     }
"markup.list"               = { fg = "white"                                   }
"markup.quote"              = { fg = "cyan"                                    }
"markup.link.url"           = { fg = "cyan"  , modifiers = ["underlined"]      }
"markup.link.text"          = { fg = "gold"                                    }
"markup.link.label"         = { fg = "gold"                                    }

"diff.plus"                 = "green"
"diff.delta"                = "gold"
"diff.minus"                = "red"

"info"                      = { fg = "white"                                   }
"hint"                      = { fg = "green"                                   }
"diagnostic"                = { modifiers = ["underlined"]                     }
"warning"                   = { fg = "yellow"                                  }
"error"                     = { fg = "red"                                     }

"ui.background"             = { bg = "dark"                                    }

"ui.cursor"                 = { fg = "white", modifiers = ["reversed"]         }
"ui.cursor.primary"         = { fg = "cyan", modifiers = ["reversed"]          }
"ui.cursor.match"           = { fg = "red", modifiers = ["underlined", "bold"] }

"ui.selection"              = { bg = "#4c4b4b"                                 }
"ui.selection.primary"      = { bg = "#4c4b4b"                                 }
"ui.cursorline.primary"     = { bg = "#313131"                                 }

"ui.linenr"                 = { fg = "#7d7d7d"                                 }
"ui.linenr.selected"        = { fg = "white", modifiers = ["bold"]             }
"ui.excerpt.header"         = { fg = "gold", modifiers = ["bold"]              }
"ui.excerpt.match"          = { fg = "red", modifiers = ["bold"]               }

# Rendered tabs. Dimmer than the gutter: the point of drawing them is that the
# shape of an indent can be checked when it matters, not that it competes with
# the code for attention.
"ui.virtual.whitespace"     = { fg = "#4a4a4a"                                 }

# The keys `leap` paints over its targets. The one scope here that is meant to
# be read before the code under it, so it takes a background of its own -- and
# light_yellow rather than the statusline's gold, because a screenful of these
# should not read as a row of mode blocks.
"ui.virtual.jump-label"     = { fg = "dark", bg = "light_yellow", modifiers = ["bold"] }

# The destination a smart-jump message names -- apart from the file name that
# sits beside it on the bar.
"ui.jump.next"              = { fg = "green"                                   }

"ui.statusline"             = { fg = "white", bg = "#313131"                   }
"ui.statusline.inactive"    = { fg = "white", bg = "#313131"                   }
"ui.statusline.normal"      = { fg = "dark", bg = "green"                      }
"ui.statusline.insert"      = { fg = "dark", bg = "gold"                       }
"ui.statusline.select"      = { fg = "dark", bg = "light_yellow"               }

"ui.text"                   = { fg = "white"                                   }
"ui.text.focus"             = { fg = "white", bg = "#404040"                   }

# Floating surfaces separate by a lighter fill, not by the border stroke: the
# higher a surface sits, the lighter it is, and the frame around it stays
# quieter than the text inside it.
"ui.help"                   = { fg = "white", bg = "#363634"                   }
"ui.popup"                  = { bg = "#363634"                                 }
"ui.window"                 = { fg = "#5a5a5a"                                 }
"ui.menu"                   = { fg = "white", bg = "#363634"                   }
"ui.menu.selected"          = { fg = "dark", bg = "cyan"                       }
"ui.menu.scroll"            = { fg = "white", bg = "#474B43A4"                 }

# red marks what leaves or breaks: error, diff.minus, the two match scopes,
# and the control-flow exits. Nothing that merely sits on the line wears it.
[palette]
light_yellow = "#ffce78"
red          = "#ff8665"
green        = "#8EC87C"
cyan         = "#65B0B2"
white        = "#bfbfbf"
dark         = "#252524"
moss_green   = "#58865A"
light_gray   = "#8a938f"
gold         = "#D19A66"
